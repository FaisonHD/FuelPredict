<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FuelPredict zeigt Tankstellenpreise und hilft dabei, Preisentwicklungen einzuschätzen.">
  <title>FuelPredict</title>
</head>
<body>
  <header>
    <h1>FuelPredict</h1>
    <p>Tankpreise vergleichen und Preisentwicklungen im Blick behalten.</p>
    <nav aria-label="Seitennavigation"><a href="#station-search">Zur Tankstellensuche</a></nav>
  </header>

  <main>
    <section aria-labelledby="search-heading">
      <h2 id="search-heading">Tankstelle finden</h2>
      <form id="station-search">
        <label for="location">Ort oder Postleitzahl</label>
        <input id="location" name="location" type="search" placeholder="z. B. Karlsruhe" autocomplete="postal-code" required>

        <label for="fuel-type">Kraftstoff</label>
        <select id="fuel-type" name="fuel-type">
          <option value="e5">Super E5</option>
          <option value="e10">Super E10</option>
          <option value="diesel">Diesel</option>
        </select>

        <label for="radius">Suchradius</label>
        <select id="radius" name="radius">
          <option value="5">5 km</option>
          <option value="10" selected>10 km</option>
          <option value="20">20 km</option>
          <option value="50">50 km</option>
        </select>

        <button type="submit">Suchen</button>
        <button type="reset">Zurücksetzen</button>
      </form>
    </section>

    <section aria-labelledby="results-heading">
      <h2 id="results-heading">Tankstellen in der Nähe</h2>
      <p id="search-status" role="status" aria-live="polite">Noch keine Tankstellen geladen.</p>
    </section>
  </main>
  <footer>
    <p>FuelPredict – Studienprojekt zur Analyse von Tankpreisen.</p>
  </footer>
  <script>
    const form = document.querySelector('#station-search');
    const status = document.querySelector('#search-status');

    form.addEventListener('reset', () => {
      status.textContent = 'Noch keine Tankstellen geladen.';
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const location = form.elements.location.value.trim();
      if (!location) {
        status.textContent = 'Bitte einen Ort oder eine Postleitzahl eingeben.';
        return;
      }
      const fuel = form.elements['fuel-type'].selectedOptions[0].textContent;
      const radius = form.elements.radius.value;
      status.textContent = `Suche nach ${fuel}-Preisen im Umkreis von ${radius} km um ${location} ist noch nicht verfügbar. Die Datenanbindung folgt.`;
    });
  </script>
</body>
</html>
